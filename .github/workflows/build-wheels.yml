name: Build Wheels

on:
  workflow_call:
    inputs:
      upload:
        description: "Upload the wheels and sdist as artifacts"
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Sanity test before we kick off builds.
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ciso8601
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade build
          python -m build
          pip install dist/ciso8601-*.whl
      - name: Install testing dependencies
        run: |
          . venv/bin/activate
          pip install pytz
      - name: Test
        run: |
          . venv/bin/activate
          python -m unittest


  build_wheels:
    name: Build - ${{ matrix.os }} (${{ matrix.cibw_archs }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cibw_archs: "x86_64"
          - os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
          - os: windows-2025
            cibw_archs: "AMD64"
          - os: windows-11-arm
            cibw_archs: "ARM64"
          # One job per macOS architecture so they build in parallel.
          - os: macos-26-intel
            cibw_archs: "x86_64"
          - os: macos-26
            cibw_archs: "arm64"
          - os: macos-26
            cibw_archs: "universal2"
    steps:
      - uses: actions/checkout@v6

      # cibuildwheel 4 dropped Python 3.8, so build only 3.8 with the 3.x series.
      - name: Build legacy wheels
        uses: closeio/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp38-* pp38-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ALLOW_EMPTY: "1"

      - name: Build wheels
        uses: closeio/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cibw_archs }}-wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build - Source
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "3.13"

      - name: Get build tool
        run: pip install --upgrade build

      - name: Build sdist
        run: python -m build

      - if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
